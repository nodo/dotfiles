onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "#282828"

[terminal]

[update]

[keys]
prefix = "ctrl+s"
previous_workspace = "prefix+shift+k" # optional, unset by default
next_workspace = "prefix+shift+j"     # optional, unset by default
switch_workspace = "prefix+shift+1..9" # jump to workspace N
previous_agent = "prefix+shift+a"     # cycle agents in the agent panel
next_agent = "prefix+a"
focus_agent = "prefix+ctrl+1..9"     # jump to agent N (agent panel order)
rename_tab = "prefix+comma"
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

[ui]
mouse_capture = true
prompt_new_tab_name = false
agent_panel_sort = "spaces"

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["agent"]]

[ui.toast]

[ui.toast.herdr]
# position = "bottom-right"

[ui.toast.clipboard]

[ui.sound]

[session]

[remote]

[experimental]
pane_history = false

[advanced]

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "$HOME/personal/dotfiles/config/herdr-number.sh"
description = "renumber workspaces and agents"
