onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "#282828"

[terminal]

[update]

[keys]
prefix = "ctrl+s"
previous_workspace = "prefix+shift+k" # optional, unset by default
next_workspace = "prefix+shift+j"     # optional, unset by default
rename_tab = "prefix+comma"
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

[ui]
mouse_capture = true
prompt_new_tab_name = false
agent_panel_sort = "spaces"

[ui.sidebar.spaces]
row_gap = 1
# rows = [["state_icon", "workspace"]]

[ui.toast]

[ui.toast.herdr]
# position = "bottom-right"

[ui.toast.clipboard]

[ui.sound]

[session]

[remote]

[experimental]
pane_history = false

[advanced]
