unbind r
bind r source-file ~/.tmux.conf

# Change the prefix key to C-space
unbind C-b
set -g prefix C-s

# Mouse on: drag to select, release copies to the macOS clipboard.
set -g mouse on
set -s set-clipboard on
bind-key -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' \
  'if -Ft= "#{pane_in_mode}" "copy-mode -M" "send-keys -M"' \
  'copy-mode -M'
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

set -g default-terminal "tmux-256color"

# No bells at all
set -g bell-action none

set -g extended-keys on
set -g extended-keys-format csi-u

# nvim healthcheck
set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'XXX:RGB'
set-option -a terminal-overrides 'xterm-256color:RGB'

# Start numbering at 1 and renumber when closing a pane
set -g base-index 1
set-option -g renumber-windows on

# status bar at the top
set-option -g status-position top

# Open panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move around
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Gruvbox Material Dark Medium (matches nvim sainnhe/gruvbox-material + ghostty)
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-justify left
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100

# Rounded window pills
set -g window-status-separator ""
set -g window-status-format "#[fg=#3a3735,bg=#282828]#[fg=#d4be98,bg=#3a3735] #I  #W#{?#{@workmux_status}, #{@workmux_status}, ○} #[fg=#3a3735,bg=#282828]"
set -g window-status-current-format "#[fg=#89b482,bg=#282828]#[fg=#282828,bg=#89b482,bold] #I #[fg=#d4be98,bg=#3a3735,nobold] #W#{?#{@workmux_status}, #{@workmux_status}, ○} #[fg=#3a3735,bg=#282828]"

# Right side: current command + Amsterdam time
set -g status-right "#[fg=#3a3735,bg=#282828]#[fg=#d4be98,bg=#3a3735] #{pane_current_command} #[fg=#d8a657,bg=#3a3735]#[fg=#282828,bg=#d8a657,bold] #(TZ='Europe/Amsterdam' date '+%%Y-%m-%d %%H:%%M') #[fg=#d8a657,bg=#282828]"

# Borders, modes, messages
set -g pane-border-indicators off
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#89b482"
set -g window-style "fg=#928374"
set -g window-active-style "fg=#d4be98"
set -g mode-style "bg=#89b482,fg=#282828"
set -g message-style "bg=#3a3735,fg=#d4be98"
set -g message-command-style "bg=#3a3735,fg=#d4be98"
