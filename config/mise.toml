# mise global config.

[env]
# Pin GOBIN to the stable, version-independent ~/go/bin instead of letting
# mise's Go backend default it to <toolchain>/bin (e.g. .../go/1.26.2/bin).
# Keeps `go install` binaries on PATH across Go version bumps, and out of
# the GOROOT bin dir where they'd mingle with `go`/`gofmt`.
GOBIN = "{{env.HOME}}/go/bin"

[settings]
trusted_config_paths = ["~/work", "~/personal/dotfiles"]

[settings.github]
# gh keeps its token in the macOS keychain, which mise can't read from hosts.yml
credential_command = "~/.local/share/mise/shims/gh auth token"

[tools]
atuin = "latest"
btop = { version = "latest", os = ["linux"] } # aqua has no macOS build; brew on macOS
"github:entireio/cli" = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
jq = "latest"
k9s = "latest"
kind = "latest"
kubectl = "latest"
mkcert = "latest"
"aqua:neovim/neovim" = "latest"
opencode = "latest"
ripgrep = "latest"
starship = "latest"
tree-sitter = "latest"
zoxide = "latest"
