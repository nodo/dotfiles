# Machine setup: `mise trust && mise bootstrap`
# CLI tools live in config/mise.toml (global config) so they're on PATH everywhere.

[bootstrap.packages]
# Formulae not available as mise tools
"brew:btop" = { os = "macos" }
"brew:git" = { os = "macos" }
"apt:git" = { os = "linux" }
"brew:sox" = { os = "macos" }
"brew:tree" = { os = "macos" }
"apt:tree" = { os = "linux" }
"brew:watch" = { os = "macos" }
"apt:procps" = { os = "linux" } # provides watch

# macOS apps
"brew-cask:1password" = { os = "macos" }
"brew-cask:1password-cli" = { os = "macos" }
"brew-cask:alfred" = { os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
"brew-cask:signal" = { os = "macos" }
"brew-cask:slack" = { os = "macos" }
"brew-cask:whatsapp" = { os = "macos" }
"brew-cask:zoom" = { os = "macos" }

[bootstrap.hooks]
# Command Line Tools have no native resource; guard so re-runs are no-ops
pre-packages = "[ \"$(uname -s)\" != Darwin ] || xcode-select -p >/dev/null 2>&1 || xcode-select --install"
post-tools = [
  "mise run completions",
  # `docker compose`/`docker buildx` only find plugins in ~/.docker/cli-plugins
  "[ \"$(uname -s)\" != Darwin ] || { mkdir -p ~/.docker/cli-plugins && for p in docker-compose docker-buildx; do ln -sfn \"$(mise which $p)\" ~/.docker/cli-plugins/$p; done; }",
]

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.zshrc" = "config/zshrc"
"~/.gitconfig" = "config/gitconfig"
"~/.gitconfig-work" = "config/gitconfig-work"
"~/.ripgreprc" = "config/ripgreprc"
"~/.config/starship.toml" = "config/starship.toml"
"~/.config/herdr/config.toml" = "config/herdr.toml"
"~/.config/mise/config.toml" = "config/mise.toml"
"~/.config/nvim" = "nvim"
"~/.config/ghostty" = { source = "ghostty", variants = [{ os = "macos" }] }

[tasks.bootstrap]
description = "Smoke test after bootstrap"
run = "zsh -c 'source ~/.zshrc && echo zshrc OK'"

[tasks.completions]
description = "Generate zsh completions for mise-managed tools"
run = """
set -e
dir=~/.local/share/zsh/site-functions
mkdir -p "$dir"
mise completion zsh > "$dir/_mise"
gh completion -s zsh > "$dir/_gh"
rg --generate complete-zsh > "$dir/_rg"
fd --gen-completions zsh > "$dir/_fd"
atuin gen-completions --shell zsh > "$dir/_atuin"
starship completions zsh > "$dir/_starship"
k9s completion zsh > "$dir/_k9s"
kubectl completion zsh > "$dir/_kubectl"
kind completion zsh > "$dir/_kind"
if [ "$(uname -s)" = Darwin ]; then
  docker completion zsh > "$dir/_docker"
  colima completion zsh > "$dir/_colima"
  limactl completion zsh > "$dir/_limactl"
fi
entire completion zsh > "$dir/_entire"
herdr completion zsh > "$dir/_herdr"
tree-sitter complete --shell zsh > "$dir/_tree-sitter"
rm -f ~/.zcompdump # compinit -C won't notice new files otherwise
"""

[tasks.test]
description = "Run bootstrap in a Linux container"
run = "./script/test.sh"
